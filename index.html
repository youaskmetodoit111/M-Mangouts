
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>M+ Mangouts - Welcome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="entry-screen">
    <img src="m+.png" height="125">
    <img src="WhatsApp Image 2025-10-07 at 5.25.49 PM.jpeg">
    <h2>Enter the message you want...</h2>
    <p>NOTE: It must be an appropraite message!</p>
    <form id="entry-form">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="text" id="title" placeholder="Your Title" required>
      <textarea id="description" placeholder="Your Description" required></textarea>
      <button type="submit">Enter Mangouts</button>
    </form>
  </div>

  <div id="chat-screen" style="display:none;">
    <h2>Welcome to M+ Mangouts</h2>
    <div id="user-info"></div>
    <div id="chat-box"></div>
    <input type="text" id="message-input" placeholder="Type your message...">
    <button id="send-button">Send</button>
  </div>

  <script src="script.js"></script>
  <script src="server.js"></script>
</body>
</html>
